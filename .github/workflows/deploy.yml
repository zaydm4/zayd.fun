name: Deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 12 * * *"   # refresh Substack posts daily
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install sharp (thumbnails and image shrinking)
        run: npm install --no-save --no-audit --no-fund sharp
      - name: Pull latest Substack posts
        run: node scripts/fetch-posts.mjs
      - name: Build media lists and thumbnails from assets/
        run: node scripts/build-media.mjs
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html css js data assets _site/
          [ -f resume.pdf ] && cp resume.pdf _site/ || true
          [ -f CNAME ] && cp CNAME _site/ || true
      - name: Shrink large images (site copy only)
        run: |
          node scripts/optimize-images.mjs _site/assets
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
