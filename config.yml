baseURL: "https://zayd.fun/"
title: "zayd's corner"
theme: PaperMod

enableInlineShortcodes: true
enableRobotsTXT: true
pagination:
  pagerSize: 20

taxonomies:
  tag: tags

menu:
  main:
    - name: Blog
      url: https://rectitudes.substack.com
      weight: 1
    - name: Portfolio
      url: portfolio/
      weight: 2
    - name: Contact
      url: contact/
      weight: 3

params:
  description: "This website hosts zayd mahmud's portfolio, socials, and contact information."
  author: zayd mahmud
  # googleAnalyticsID: "G-XXXXX"
  DateFormat: "January 2006"
  defaultTheme: dark
  hideFooter: true
  disableThemeToggle: false
  ShowShareButtons: false
  ShowReadingTime: false
  disableSpecial1stPost: true
  disableAnchoredHeadings: true
  ShowPostNavLinks: false
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  ShowAllPagesInArchive: false
  ShowToc: false
  disableScrollToTop: true
  TocOpen: true
  ShowWordCount: false
  UseHugoToc: true
  comments: false
  math: true
  profileMode:
    enabled: true
    title: Zayd Mahmud
    subtitle: "I am a senior at Plano West Senior High School. I'm academically interested in philosophy and electrical engineering. I compete in Lincoln-Douglas debate at the national level, coach debate privately, and used to work as a freelance 3D generalist for nearly six years."
    imageUrl: "icon.jpeg"
    imageWidth: 160
    imageHeight: 160
    buttons:
      - name: Portfolio
        url: portfolio/
      - name: Blog
        url: https://rectitudes.substack.com
      - name: Contact
        url: contact/
  socialIcons:
    - name: CV
      url: cv.pdf
    - name: Email
      url: mailto:mail@zayd.fun
    - name: Substack
      url: https://rectitudes.substack.com
    - name: LinkedIn
      url: https://linkedin.com/in/zayd-mahmud-879409300/
    - name: Twitter
      url: https://x.com/zira3d
    - name: GitHub
      url: https://github.com/zaydm4
  assets:
    disableScrollBarStyle: true
  cover:
    hiddenInList: false
    hiddenInSingle: true
  label:
    text: "zayd mahmud"
    icon: favicon.ico
    iconHeight: 18

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    guessSyntax: true
    style: autumn
  tableOfContents:
    endLevel: 2
    ordered: false
    startLevel: 2
